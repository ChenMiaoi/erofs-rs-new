name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo check -p erofs-format --no-default-features --locked
      - run: cargo check -p erofs-rs --features opendal --locked
      - run: cc -std=c11 -Wall -Wextra -Werror -o /tmp/erofs-layout-probe scripts/erofs-layout-probe.c
      - run: /tmp/erofs-layout-probe
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path target/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/lcov.info
          if-no-files-found: error
          retention-days: 14
