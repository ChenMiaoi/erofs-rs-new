name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: clippy

      - run: cargo fmt --all --check
      - run: cargo check -p erofs-format --no-default-features --locked
      - run: cc -std=c11 -Wall -Wextra -Werror -o /tmp/erofs-layout-probe scripts/erofs-layout-probe.c
      - run: /tmp/erofs-layout-probe
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path target/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/lcov.info
